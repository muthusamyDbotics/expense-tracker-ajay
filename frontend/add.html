<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Analysis & Expense Tracking System</title>
    <link rel="stylesheet" href="add.css">
</head>
<body>

    <div class="add-acc">
        <h2>Add Account</h2>

        <form id="account-form">
            <label for="account-name">Account Name:</label>
            <input type="text" id="account-name" placeholder="Account Name" required>
            <label for="account-type">Account Type:</label>
            <select id="account-type" required>
                <option value="">Select Account Type</option>
                <option value="checking">Bank Account Balance</option>
                <option value="credit">Credit</option>
            </select>
            <label for="initial-balance">Initial Balance:</label>
            <input type="number" id="initial-balance" placeholder="Initial Balance" min="0" step="0.01" required>
            <button type="submit" id="add-button">Add Account</button>
            <button type="button" onclick="window.location.href='Dashboard .html'">Back</button>

            <p id="message" role="status"></p>
        </form>
    </div>

    <script>
        // Backend endpoint 
        const API_URL = `http://127.0.0.1:8000/accounts/`;

        
        const userId = Number(localStorage.getItem("user_id"));
        if (!userId) {
            window.location.href = "login.html";
        }

        const form = document.getElementById("account-form");
        const message = document.getElementById("message");
        const addButton = document.getElementById("add-button");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const accountData = {
                account_name: document.getElementById("account-name").value.trim(),
                account_type: document.getElementById("account-type").value,
                balance: Number(document.getElementById("initial-balance").value),
                user_id: userId
            };

            addButton.disabled = true;
            message.style.color = "black";
            message.textContent = "Saving account...";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(accountData)
                });

                const result = await response.json();

                if (response.ok) {
                    message.style.color = "green";
                    message.textContent = "Account added successfully!";

                    setTimeout(function () {
                        window.location.href = "Dashboard .html";
                    }, 1000);
                } else {
                    message.style.color = "red";
                    message.textContent = typeof result.detail === "string"
                        ? result.detail
                        : JSON.stringify(result.detail);
                }

            } catch (error) {
                message.style.color = "red";
                message.textContent = "Cannot connect to FastAPI. Is the backend running?";
                console.error("Add account error:", error);
            } finally {
                addButton.disabled = false;
            }
        });
    </script>

</body>
</html>
