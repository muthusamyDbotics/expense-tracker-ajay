
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Analysis & Expense Tracking System</title>
    <link rel="stylesheet" href="add.css">
</head>

<body>

    <div class="add-acc">
        <h2>Add Account</h2>

        <form id="account-form">

            <label for="account-name">Account Name:</label>
            <input type="text" id="account-name" name="account_name" placeholder="Account Name" required>
            <label for="account-type">Account Type:</label>
            <select id="account-type" name="account_type" required>
                <option value="">Select Account Type</option>
                <option value="checking">Bank Account Balance</option>
                <option value="credit">Credit</option>
            </select>
            <label for="initial-balance">Initial Balance:</label>
            <input type="number" id="initial-balance"name="initial_balance" placeholder="Initial Balance" min="0"step="0.01"required>

            <button type="submit" id="add-button">Add Account</button>

            <button type="button"  onclick="window.location.href='Dashboard.html'">
                Back
            </button>

            <p id="message" role="status"></p>
        </form>
    </div>


        

                    

    <script>
    const form = document.getElementById("account-form");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const accountData = {
            account_name: document.getElementById("account-name").value,
            account_type: document.getElementById("account-type").value,
            balance: Number(document.getElementById("initial-balance").value),
            user_id: 1
        };

        try {
            const response = await fetch(`http://127.0.0.1:8000/accounts/`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(accountData)
            });

            const result = await response.json();

            if (response.ok) {
                message.textContent = "Account added successfully!";
                message.style.color = "green";

                setTimeout(function() {
                    window.location.href = "Dashboard .html";
                }, 1000);

            } else {
                message.textContent = typeof result.detail === "string"
                    ? result.detail
                    : JSON.stringify(result.detail);

                message.style.color = "red";
            }

        } catch (error) {
            message.textContent = "Cannot connect to FastAPI.";
            message.style.color = "red";

            console.log(error);
        }
    });
</script>
</body>
</html>
