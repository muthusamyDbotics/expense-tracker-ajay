<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINANCIAL ANALYSIS & EXPENSE TRACKING SYSTEM</title>
    <link rel="stylesheet" href="createacc.css">
</head>
<body>

    <div class="create-account">
        <h2>Create Account</h2>
        <form id="registerForm">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Username" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password"placeholder="Password" required>
            <button type="submit" id="registerButton">Create Account</button>
            <button type="button" onclick="window.location.href='login.html'">Back to Login</button>

            <p id="message" role="status"></p>

        </form>
    </div>

    <script>
        const API_URL = `http://127.0.0.1:8000/auth/register`;

        const registerForm = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const registerButton = document.getElementById("registerButton");
        registerForm.addEventListener("submit", async function (event) {
            event.preventDefault();
            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            message.textContent = "Creating account...";
            registerButton.disabled = true;

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail || "Registration failed."
                    );
                }

                message.textContent = "Account created successfully! Redirecting to login...";

                registerForm.reset();

                setTimeout(function () {
                    window.location.href = "login.html";
                }, 1500);

            } catch (error) {
                message.textContent =
                    "Error: " + error.message;

            } finally {
                registerButton.disabled = false;
            }
        });
    </script>

</body>
</html>
