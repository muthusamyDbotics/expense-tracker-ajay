<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Analysis & Expense Tracking System</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login" id="login-form">
        <h2>Login</h2>
        <form id="loginForm">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username"placeholder="Enter your username" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password"placeholder="Enter your password" required>

            <button type="submit" id="login">
                Login
            </button>

            <button type="button" id="createaccount">
                Create Account
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script>
        // Login form
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // const formData = new URLSearchParams();
            // formData.append("username", username);
            // formData.append("password", password);

            message.textContent = "Logging in...";

            try {
                const response = await fetch(`http://127.0.0.1:8000/auth/login`, {
                    method: "POST",
                    headers: {
                       
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    message.textContent = "Login successful!";

                    // Save the token if the backend returns one
                    if (data.access_token) {
                        sessionStorage.setItem("access_token", data.access_token);
                    }

                    // Open the dashboard after successful login
                    window.location.href = "Dashboard .html";

                } else {
                    message.textContent = data.detail || "Invalid username or password.";
                }

            } catch (error) {
                message.textContent ="Unable to connect to the backend. Please try again.";
                console.error("Login error:", error);
            }
        });

        

        // Open the registration page
        document.getElementById("createaccount").addEventListener(
            "click",
            function () {
                window.location.href = "createacc.html";
            }
        );
    </script>

</body>
</html>
